---
layout: default
title: Slides
---

<div class='posts'>
  {% assign slides = site.pages | where: 'layout', 'revealjs' | sort: 'date' | reverse %}

  <div class='post-listing'>
    <ul>
      {% for page in slides %}
        <li>
          <time class='published-on' datetime='{{ page.date | date: "%Y-%m-%d" }}'>{{ page.date | date: "%d %b" }}</time>
          <div class='post-details'>
            <a class='title' href='{{ page.url }}'>{{ page.title }}</a>
          </div>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>
